name: Android Home Bridge

on:
  pull_request:
    paths: ['apps/android-home-bridge/**', '.github/workflows/android-home-bridge.yml']
  push:
    branches: [main]
    paths: ['apps/android-home-bridge/**', '.github/workflows/android-home-bridge.yml']

permissions:
  contents: read

concurrency:
  group: android-home-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android-home-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install verified Google Home SDK
        run: python3 scripts/setup_sdk.py
      - name: Test, lint, and build
        run: ./gradlew :protocol:test :app:lintDebug :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: waffled-home-bridge-debug
          path: apps/android-home-bridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
